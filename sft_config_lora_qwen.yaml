model:
  name_or_path:       /root/autodl-tmp/Qwen2.5-1.5B-Instruct
  trust_remote_code:  true

data:
  train_path:         /root/autodl-tmp/dataset_cot/train
  eval_path:          /root/autodl-tmp/dataset_cot/eval
  max_seq_length:     2048      # 提升以容纳 <think> 链 + 98条权重

training:
  output_dir:                   /root/autodl-tmp/model_lora_qwen
  per_device_train_batch_size:  4
  gradient_accumulation_steps:  4    # global batch = 16
  learning_rate:                5e-5  # 全参微调2e-4太高，LoRA用5e-5足够
  num_train_epochs:             10
  logging_steps:                20
  save_steps:                   500

lora:
  r:        16
  alpha:    32
  dropout:  0.05

seed: 42
