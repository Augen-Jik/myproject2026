<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6472"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9aa0aa" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 28px "Times New Roman", Georgia, serif; fill:#4b4453; }
      .panel-title { font: italic 700 24px "Times New Roman", Georgia, serif; }
      .label { font: 600 18px "Arial", "Helvetica", sans-serif; fill:#3f3f46; }
      .small { font: 500 14px "Arial", "Helvetica", sans-serif; fill:#4b5563; }
      .tiny { font: 500 12px "Arial", "Helvetica", sans-serif; fill:#6b7280; }
      .mono { font: 600 13px "Courier New", monospace; fill:#374151; }
      .panel { rx:18; ry:18; stroke-width:2.2; filter:url(#shadow); }
      .dashed { stroke-dasharray:10 7; }
      .flow { stroke:#5e6472; stroke-width:3.2; fill:none; marker-end:url(#arrow); }
      .flow-thin { stroke:#6b7280; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .feedback { stroke:#d15aa4; stroke-width:4; fill:none; marker-end:url(#arrow); }
      .softline { stroke:#b8bec9; stroke-width:1.4; fill:none; }
      .mini { rx:8; ry:8; stroke-width:1.5; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="980" fill="#ededed"/>
  <rect x="18" y="18" width="1564" height="944" fill="none" stroke="#2f2f2f" stroke-width="2"/>

  <text x="800" y="54" text-anchor="middle" class="title">Academic System Architecture Diagram</text>

  <!-- ============ Left Top: Input Encoding ============ -->
  <rect class="panel" x="45" y="85" width="305" height="355" fill="#f7efe4" stroke="#a67d52"/>
  <text x="65" y="118" class="panel-title" fill="#9a6a2d">Spatiotemporal Input Encoding</text>

  <rect x="72" y="145" width="245" height="70" fill="#ffffff" stroke="#9f8d74" class="mini"/>
  <text x="90" y="170" class="label">Scene Profile</text>
  <rect x="90" y="182" width="54" height="13" fill="#8dd3c7" stroke="#5e8f89"/>
  <rect x="150" y="182" width="54" height="13" fill="#80b1d3" stroke="#577993"/>
  <rect x="210" y="182" width="54" height="13" fill="#fdb462" stroke="#ad7a3d"/>
  <text x="90" y="208" class="tiny">density / phase / closure / reroute / seed</text>

  <line x1="197" y1="215" x2="197" y2="246" class="softline"/>

  <rect x="70" y="248" width="255" height="155" fill="#fffaf4" stroke="#b9a081" class="mini"/>
  <text x="88" y="274" class="label">Structured Tags</text>

  <rect x="88" y="290" width="74" height="26" fill="#e5ecf6" stroke="#8da2c4" class="mini"/>
  <text x="96" y="307" class="mono">TASK=SP</text>

  <rect x="174" y="290" width="118" height="26" fill="#f3e7f4" stroke="#bf8fbb" class="mini"/>
  <text x="184" y="307" class="mono">SCENE_TYPE</text>

  <rect x="88" y="327" width="62" height="26" fill="#eef7e9" stroke="#8bb37c" class="mini"/>
  <text x="104" y="344" class="mono">ROAD</text>

  <rect x="158" y="327" width="50" height="26" fill="#fff2d9" stroke="#c8a25f" class="mini"/>
  <text x="171" y="344" class="mono">DIR</text>

  <rect x="216" y="327" width="76" height="26" fill="#e7eefc" stroke="#8ba0ca" class="mini"/>
  <text x="228" y="344" class="mono">RANGE</text>

  <rect x="88" y="364" width="62" height="26" fill="#f8e7e7" stroke="#c28c8c" class="mini"/>
  <text x="104" y="381" class="mono">TIME</text>

  <rect x="158" y="364" width="134" height="26" fill="#edf5ea" stroke="#88b084" class="mini"/>
  <text x="173" y="381" class="mono">CONFLICT / PROP</text>

  <text x="88" y="418" class="small">Natural language + scene profile -&gt; structured input</text>

  <!-- ============ Left Bottom: Prompt Rules ============ -->
  <rect class="panel dashed" x="45" y="470" width="315" height="445" fill="#fbf6e9" stroke="#d1a64f"/>
  <text x="68" y="505" class="panel-title" fill="#c08d20">Prompt Schema &amp; Parsing Rules</text>

  <rect x="72" y="535" width="122" height="78" fill="#ffffff" stroke="#c8b693" class="mini"/>
  <text x="86" y="560" class="label">Schema Tokens</text>
  <text x="86" y="584" class="mono">TASK, ROAD</text>
  <text x="86" y="603" class="mono">DIR, RANGE</text>

  <rect x="210" y="535" width="120" height="78" fill="#ffffff" stroke="#c8b693" class="mini"/>
  <text x="224" y="560" class="label">Constraints</text>
  <text x="224" y="584" class="mono">TIME</text>
  <text x="224" y="603" class="mono">CONFLICT</text>

  <rect x="72" y="635" width="258" height="110" fill="#fffdf8" stroke="#d8c398" class="mini"/>
  <text x="88" y="664" class="label">Parser Guardrails</text>
  <text x="88" y="690" class="small">• sparse output only</text>
  <text x="88" y="714" class="small">• anchor-aligned edge mapping</text>
  <text x="88" y="738" class="small">• confidence / fail signal separation</text>

  <rect x="72" y="770" width="258" height="112" fill="#fffdf8" stroke="#d8c398" class="mini"/>
  <text x="88" y="798" class="label">Strict Evaluation Focus</text>
  <text x="88" y="824" class="small">• no_anchor_when_gt_changed</text>
  <text x="88" y="848" class="small">• gt_changed_edge_recall</text>
  <text x="88" y="872" class="small">• MAE_on_changed_edges / parse_fail</text>

  <!-- ============ Center Top: Sparse Extraction ============ -->
  <rect class="panel" x="390" y="85" width="905" height="395" fill="#eef2fb" stroke="#7d87bf"/>
  <text x="415" y="118" class="panel-title" fill="#6a73ae">Sparse Semantic Anchor Extraction</text>

  <!-- input bundle -->
  <rect x="420" y="150" width="135" height="230" fill="#f7f8fd" stroke="#a4add4" class="mini dashed"/>
  <text x="444" y="176" class="label">Input O</text>

  <rect x="445" y="198" width="80" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="474" y="216" class="mono">o₁</text>
  <rect x="445" y="238" width="80" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="474" y="256" class="mono">o₂</text>
  <rect x="445" y="278" width="80" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="474" y="296" class="mono">...</text>
  <rect x="445" y="318" width="80" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="472" y="336" class="mono">oₙ</text>

  <!-- encoder MLP -->
  <rect x="585" y="193" width="120" height="130" fill="#ffffff" stroke="#98a5c8" class="mini"/>
  <text x="621" y="233" class="label">Token</text>
  <text x="620" y="258" class="label">Encoder</text>
  <text x="627" y="292" class="small">MLP</text>

  <!-- attention -->
  <rect x="745" y="170" width="180" height="175" fill="#fff8ef" stroke="#d4b77a" class="mini"/>
  <text x="798" y="205" class="panel-title" fill="#c49a43" style="font-size:22px;">Attention</text>

  <rect x="770" y="230" width="50" height="50" fill="#f9dede" stroke="#c88f8f"/>
  <rect x="820" y="230" width="50" height="50" fill="#dce7fb" stroke="#8fa6d0"/>
  <rect x="870" y="230" width="30" height="50" fill="#eadcf6" stroke="#b48cc7"/>

  <rect x="770" y="280" width="50" height="30" fill="#fbeecf" stroke="#c8a870"/>
  <rect x="820" y="280" width="50" height="30" fill="#e4f3df" stroke="#8caf81"/>
  <rect x="870" y="280" width="30" height="30" fill="#f6d9e9" stroke="#bd88a6"/>

  <text x="775" y="327" class="small">feature mixing / relation focus</text>

  <!-- parser heads -->
  <rect x="960" y="150" width="155" height="230" fill="#f7f8fd" stroke="#a4add4" class="mini dashed"/>
  <text x="988" y="176" class="label">Anchor Heads</text>

  <rect x="985" y="198" width="100" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="1002" y="216" class="mono">anchor₁</text>
  <rect x="985" y="238" width="100" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="1002" y="256" class="mono">anchor₂</text>
  <rect x="985" y="278" width="100" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="1021" y="296" class="mono">...</text>
  <rect x="985" y="318" width="100" height="28" fill="#d8ddf7" stroke="#8897c8" class="mini"/>
  <text x="1002" y="336" class="mono">anchorₖ</text>

  <!-- output parser -->
  <rect x="1140" y="170" width="122" height="175" fill="#ffffff" stroke="#98a5c8" class="mini"/>
  <text x="1170" y="205" class="label">Parser</text>
  <text x="1157" y="230" class="small">mapped weights</text>
  <text x="1157" y="255" class="small">parse confidence</text>
  <text x="1157" y="280" class="small">changed-edge focus</text>
  <text x="1157" y="305" class="small">fail / conflict tags</text>

  <!-- arrows center top -->
  <path d="M 350 262 C 372 262, 386 262, 418 262" class="flow"/>
  <path d="M 555 262 C 570 262, 576 262, 585 262" class="flow"/>
  <path d="M 705 262 C 722 262, 730 258, 745 258" class="flow"/>
  <path d="M 925 258 C 940 258, 948 258, 960 258" class="flow"/>
  <path d="M 1115 258 C 1126 258, 1132 258, 1140 258" class="flow"/>

  <text x="374" y="247" class="small">structured O</text>
  <text x="720" y="245" class="small">encoded tokens</text>
  <text x="934" y="243" class="small">sparse heads</text>
  <text x="1118" y="243" class="small">parsed outputs</text>

  <!-- bottom note inside center top -->
  <rect x="505" y="388" width="640" height="58" fill="#f9fbff" stroke="#b0bad9" class="mini"/>
  <text x="525" y="413" class="small">Key idea: do not predict the full graph edge-by-edge;</text>
  <text x="525" y="434" class="small">predict sparse semantic anomaly anchors with confidence and structured parser outputs.</text>

  <!-- ============ Right Top: Optional Appendix ============ -->
  <rect class="panel dashed" x="1320" y="110" width="235" height="255" fill="#f4fbf4" stroke="#8eb68e"/>
  <text x="1343" y="142" class="panel-title" fill="#5a9d5a" style="font-size:22px;">Optional Graph Completion</text>
  <text x="1384" y="168" class="small">(Appendix only)</text>

  <rect x="1360" y="198" width="150" height="58" fill="#ffffff" stroke="#8eb68e" class="mini"/>
  <text x="1406" y="222" class="label">Graph Block</text>
  <text x="1388" y="243" class="small">message passing / smoothing</text>

  <rect x="1360" y="275" width="150" height="58" fill="#ffffff" stroke="#8eb68e" class="mini"/>
  <text x="1393" y="299" class="label">Optional Gate</text>
  <text x="1390" y="320" class="small">use only for exploration</text>

  <path d="M 1262 258 C 1290 258, 1300 258, 1320 258" class="flow-thin"/>

  <!-- ============ Center Bottom: Cost Recovery & Search ============ -->
  <rect class="panel" x="390" y="515" width="635" height="355" fill="#f8eef5" stroke="#c483af"/>
  <text x="414" y="548" class="panel-title" fill="#b05b95">Cost Recovery &amp; Classical Search</text>

  <rect x="430" y="590" width="160" height="205" fill="#ffffff" stroke="#c79db8" class="mini"/>
  <text x="452" y="620" class="label">Recovered Edge Costs</text>

  <rect x="458" y="648" width="105" height="20" fill="#f4d8e7" stroke="#bd88a6" class="mini"/>
  <text x="474" y="663" class="mono">mapped_weights</text>
  <rect x="458" y="680" width="105" height="20" fill="#d9e4fb" stroke="#8ea4ce" class="mini"/>
  <text x="476" y="695" class="mono">changed_edges</text>
  <rect x="458" y="712" width="105" height="20" fill="#e4f1de" stroke="#88ad7b" class="mini"/>
  <text x="475" y="727" class="mono">confidence</text>
  <rect x="458" y="744" width="105" height="20" fill="#f9ecd1" stroke="#c7a76f" class="mini"/>
  <text x="481" y="759" class="mono">fallbacks</text>

  <rect x="625" y="590" width="160" height="205" fill="#fffaf7" stroke="#c79db8" class="mini"/>
  <text x="653" y="620" class="label">Changed-edge Focus</text>

  <circle cx="675" cy="690" r="52" fill="#eef2fb" stroke="#9fb0d4" stroke-width="2"/>
  <circle cx="675" cy="690" r="16" fill="#f7b4c9" stroke="#bf6b8b" stroke-width="2"/>
  <text x="648" y="763" class="small">error-aware emphasis</text>

  <rect x="815" y="575" width="175" height="235" fill="#ffffff" stroke="#c79db8" class="mini"/>
  <text x="853" y="607" class="label">Classical Search</text>

  <rect x="850" y="640" width="105" height="32" fill="#e8eefc" stroke="#8ea4ce" class="mini"/>
  <text x="880" y="661" class="mono">A*</text>

  <rect x="850" y="686" width="105" height="32" fill="#edf5ea" stroke="#88ad7b" class="mini"/>
  <text x="869" y="707" class="mono">Dijkstra</text>

  <rect x="840" y="742" width="125" height="38" fill="#f7dce9" stroke="#c37ea3" class="mini"/>
  <text x="856" y="766" class="label">Selected Route</text>

  <path d="M 1025 620 C 1065 620, 1095 620, 1130 620" class="flow"/>
  <text x="1042" y="607" class="small">route + costs</text>

  <path d="M 515 430 C 515 495, 510 515, 510 590" class="flow"/>
  <path d="M 1200 345 C 1200 430, 860 430, 860 575" class="flow"/>
  <text x="525" y="488" class="small">parsed sparse outputs</text>

  <path d="M 590 692 C 605 692, 615 692, 625 692" class="flow"/>
  <path d="M 785 692 C 798 692, 806 692, 815 692" class="flow"/>

  <!-- ============ Right Bottom: SUMO Evaluation ============ -->
  <rect class="panel" x="1060" y="475" width="455" height="395" fill="#eef8ef" stroke="#77a977"/>
  <text x="1085" y="510" class="panel-title" fill="#4d8a4d">SUMO Closed-loop Evaluation</text>

  <rect x="1095" y="555" width="180" height="96" fill="#ffffff" stroke="#97bc97" class="mini"/>
  <text x="1128" y="587" class="label">Runtime Metrics</text>
  <text x="1120" y="614" class="small">Planning Time</text>
  <text x="1120" y="636" class="small">Travel Time</text>

  <rect x="1295" y="555" width="180" height="96" fill="#ffffff" stroke="#97bc97" class="mini"/>
  <text x="1336" y="587" class="label">Traffic Metrics</text>
  <text x="1320" y="614" class="small">Queue / Delay</text>
  <text x="1320" y="636" class="small">Success Rate</text>

  <rect x="1100" y="690" width="370" height="130" fill="#f9fff9" stroke="#97bc97" class="mini"/>
  <text x="1125" y="725" class="label">Protocol-controlled Evaluation</text>
  <text x="1125" y="752" class="small">scene profile / reroute / seed / warmup / eval window</text>
  <text x="1125" y="778" class="small">environment changes are injected by protocol, not directly by the model</text>
  <text x="1125" y="804" class="small">model only affects estimated costs and route choice</text>

  <!-- mini traffic icon -->
  <rect x="1445" y="95" width="72" height="48" rx="10" ry="10" fill="#ffffff" stroke="#777"/>
  <circle cx="1465" cy="119" r="7" fill="#ef4444"/>
  <circle cx="1481" cy="119" r="7" fill="#facc15"/>
  <circle cx="1497" cy="119" r="7" fill="#22c55e"/>

  <text x="1375" y="160" class="label">Traffic Env</text>

  <!-- feedback arrow -->
  <path d="M 1510 119 C 1545 119, 1545 870, 910 870 C 620 870, 620 915, 320 915" class="feedback"/>
  <text x="1505" y="170" class="small" fill="#b94b87">closed-loop feedback</text>

  <!-- link from search to SUMO -->
  <path d="M 990 742 C 1030 742, 1042 742, 1060 742" class="flow"/>

  <!-- ============ visual separators / captions ============ -->
  <text x="736" y="470" class="small" fill="#7b7f89">main inference pipeline</text>
  <text x="1490" y="395" class="small" fill="#5b8c5b">exploratory branch</text>
  <text x="165" y="902" class="small" fill="#bd8731">input protocol &amp; parser discipline</text>

  <!-- little legends -->
  <rect x="1325" y="390" width="190" height="62" fill="#ffffff" stroke="#b2b8c3" class="mini"/>
  <line x1="1342" y1="414" x2="1385" y2="414" class="flow-thin"/>
  <text x="1394" y="419" class="tiny">main data flow</text>
  <line x1="1342" y1="438" x2="1385" y2="438" class="feedback"/>
  <text x="1394" y="443" class="tiny">closed-loop feedback</text>
</svg>