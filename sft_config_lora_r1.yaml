model:
  name_or_path:       /root/autodl-tmp/DeepSeek-R1-1.5B
  trust_remote_code:  true

data:
  train_path:         /root/autodl-tmp/dataset_cot/train
  eval_path:          /root/autodl-tmp/dataset_cot/eval
  max_seq_length:     2048      # 同样提升，R1 think 链稍长

training:
  output_dir:                   /root/autodl-tmp/model_lora_r1
  per_device_train_batch_size:  4
  gradient_accumulation_steps:  4    # global batch = 16
  learning_rate:                2e-5  # R1 更保守，防止破坏 RL 范式
  num_train_epochs:             8
  logging_steps:                20
  save_steps:                   500

lora:
  r:        16
  alpha:    32
  dropout:  0.05

seed: 42
